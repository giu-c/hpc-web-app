name: Wake Up Streamlit (Playwright)

on:
  schedule:
    - cron: '0 */6 * * *' # Ogni 6 ore
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: mcr.microsoft.com/playwright:v1.52.0-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - name: Install Playwright JS library
        run: npm install --no-save --no-audit --no-fund playwright@1.52.0

      - name: Run Headless Browser
        run: |
          node - << 'EOF'
          const { chromium } = require('playwright');

          const URL = 'https://cloudbattle.streamlit.app';
          const MAX_ATTEMPTS = 3;
          const RETRY_DELAY_MS = 10000;

          // Attende il primo locator visibile tra pagina principale e iframe
          function waitForFirstVisible(locators, timeout) {
            return Promise.any(
              locators.map(async (locator) => {
                await locator.waitFor({ state: 'visible', timeout });
                return locator;
              })
            );
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });

            try {
              for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
                const context = await browser.newContext();
                const page = await context.newPage();

                console.log(`Tentativo ${attempt}/${MAX_ATTEMPTS} - Navigazione verso ${URL}...`);
                try {
                  await page.goto(URL, { waitUntil: 'domcontentloaded', timeout: 45000 });

                  const appFrame = page.frameLocator('iframe[title="streamlitApp"]');

                  // 1. Controlla se l'app è ibernata e clicca sul pulsante di risveglio
                  const wakeButtons = [
                    page.getByRole('button', { name: /get this app back up/i }),
                    appFrame.getByRole('button', { name: /get this app back up/i }),
                  ];

                  const wakeBtn = await waitForFirstVisible(wakeButtons, 6000).catch(() => null);
                  if (wakeBtn) {
                    console.log('App in sleep rilevata, clicco sul pulsante di risveglio...');
                    await wakeBtn.click();
                  }

                  // 2. Attende il caricamento del container principale di Streamlit
                  const appContainers = [
                    page.locator('[data-testid="stAppViewContainer"]'),
                    appFrame.locator('[data-testid="stAppViewContainer"]'),
                  ];

                  await waitForFirstVisible(appContainers, 60000);

                  // Breve attesa per consolidare la connessione WebSocket
                  await page.waitForTimeout(3000);

                  console.log('App attiva e container renderizzato con successo!');
                  return;
                } catch (err) {
                  const reason = err instanceof AggregateError
                    ? err.errors.map((e) => e.message).join(' | ')
                    : err.message;
                  console.warn(`Tentativo ${attempt} fallito: ${reason}`);

                  if (attempt === MAX_ATTEMPTS) {
                    throw new Error(reason);
                  }
                  console.log(`Attendo ${RETRY_DELAY_MS / 1000} secondi prima di riprovare...`);
                  await new Promise((r) => setTimeout(r, RETRY_DELAY_MS));
                } finally {
                  await context.close().catch(() => {});
                }
              }
            } finally {
              await browser.close();
            }
          })().catch((err) => {
            console.error('Errore definitivo durante il wake-up:', err.message);
            process.exit(1);
          });
          EOF

name: Wake Up Streamlit (Playwright)

on:
  schedule:
    - cron: '0 */6 * * *' # Ogni 6 ore
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: mcr.microsoft.com/playwright:v1.52.0-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - name: Install Playwright JS library
        run: npm install --no-save playwright@1.52.0

      - name: Run Headless Browser
        run: |
          node - << 'EOF'
          const { chromium } = require('playwright');

          const URL = 'https://cloudbattle.streamlit.app';
          const MAX_ATTEMPTS = 3;

          (async () => {
            const browser = await chromium.launch({ headless: true });

            try {
              for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
                const page = await browser.newPage();
                page.setDefaultTimeout(90000);

                console.log(`Tentativo ${attempt}/${MAX_ATTEMPTS} - Navigazione verso ${URL}...`);
                try {
                  await page.goto(URL, { waitUntil: 'domcontentloaded', timeout: 90000 });

                  // Streamlit Community Cloud incapsula l'app dentro un iframe
                  const appFrame = page.frameLocator('iframe[title="streamlitApp"]');

                  // Controlla se compare il pulsante di riattivazione (nella pagina o nell'iframe)
                  const wakeButton = page
                    .locator('button:has-text("Yes, get this app back up!")')
                    .or(appFrame.locator('button:has-text("Yes, get this app back up!")'));

                  if (await wakeButton.isVisible({ timeout: 5000 }).catch(() => false)) {
                    console.log('App in sleep rilevata, clicco sul pulsante di risveglio...');
                    await wakeButton.click();
                  }

                  // Attende che il container principale di Streamlit sia renderizzato e visibile
                  const appContainer = page
                    .locator('[data-testid="stAppViewContainer"]')
                    .or(appFrame.locator('[data-testid="stAppViewContainer"]'));

                  await appContainer.waitFor({ state: 'visible', timeout: 75000 });

                  // Breve attesa extra per consolidare la connessione WebSocket attiva
                  await page.waitForTimeout(3000);

                  console.log('Container [data-testid="stAppViewContainer"] visibile. App attiva!');
                  await page.close();
                  return;
                } catch (err) {
                  console.warn(`Tentativo ${attempt} fallito: ${err.message}`);
                  await page.close().catch(() => {});
                  if (attempt === MAX_ATTEMPTS) {
                    throw err;
                  }
                  console.log('Attendo 15 secondi prima di riprovare...');
                  await new Promise((r) => setTimeout(r, 15000));
                }
              }
            } finally {
              await browser.close();
            }
          })().catch((err) => {
            console.error('Errore definitivo durante il wake-up:', err.message);
            process.exit(1);
          });
          EOF
